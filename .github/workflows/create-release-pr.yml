name: Create Release PR

on:
  push:
    branches: [main]

jobs:
  create-release-pr:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find merged PR with release label
        id: check
        run: |
          PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number' --limit 1)
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if ! echo "$LABELS" | grep -q "release:"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          if echo "$LABELS" | grep -q "release:major"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "release:minor"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate new version
        if: steps.check.outputs.found == 'true'
        id: version
        run: |
          CURRENT=$(grep '^version\s*=\s*' pyproject.toml | head -1 | sed 's/.*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          TYPE="${{ steps.check.outputs.type }}"
          if [ "$TYPE" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$TYPE" = "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - uses: astral-sh/setup-uv@v3
        if: steps.check.outputs.found == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.found == 'true'
        with:
          node-version: 22

      - name: Install npm dependencies
        if: steps.check.outputs.found == 'true'
        run: cd sdk/typescript && npm ci

      - name: Bump version
        if: steps.check.outputs.found == 'true'
        run: uv run python scripts/bump_version.py ${{ steps.version.outputs.version }}

      - name: Generate changelog
        if: steps.check.outputs.found == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create release branch and PR
        if: steps.check.outputs.found == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "release: v${VERSION}"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --title "release: v${VERSION}" --body "Release PR automático. Mergea para crear el tag v${VERSION} y disparar la publicación a npm/PyPI." --base main --head "$BRANCH" --label "release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
