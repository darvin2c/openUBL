name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find merged PR with release label
        id: check
        run: |
          PR_JSON=$(gh pr list --state merged --limit 1 --json number,labels,mergeCommit --jq '.[0]')
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MERGE_OID=$(echo "$PR_JSON" | jq -r '.mergeCommit.oid')
          if [ -z "$MERGE_OID" ] || [ "$MERGE_OID" = "null" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$MERGE_OID" HEAD; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS=$(echo "$PR_JSON" | jq -r '.labels[].name')
          if echo "$LABELS" | grep -q "^release:major$"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "^release:minor$"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "^release:patch$"; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Si el mergeCommit ya está en un tag, re-publicar ese tag si aún no tiene release.
          TAGS=$(git tag --contains "$MERGE_OID" | grep '^v' | sort -V)
          LATEST_TAG=$(echo "$TAGS" | tail -1)
          if [ -n "$LATEST_TAG" ]; then
            VERSION="${LATEST_TAG#v}"
            if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
              echo "found=false" >> "$GITHUB_OUTPUT"
            else
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "skip_bump=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate new version
        if: steps.check.outputs.found == 'true' && steps.check.outputs.skip_bump != 'true'
        id: version
        run: |
          CURRENT=$(grep '^version\s*=\s*' pyproject.toml | head -1 | sed 's/.*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          TYPE="${{ steps.check.outputs.type }}"
          if [ "$TYPE" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$TYPE" = "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - uses: astral-sh/setup-uv@v3
        if: steps.check.outputs.skip_bump != 'true' && steps.version.outputs.version != ''
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip_bump != 'true' && steps.version.outputs.version != ''
        with:
          node-version: 22

      - name: Install npm dependencies
        if: steps.check.outputs.skip_bump != 'true' && steps.version.outputs.version != ''
        run: cd sdk/typescript && npm ci

      - name: Bump version
        if: steps.check.outputs.skip_bump != 'true' && steps.version.outputs.version != ''
        run: uv run python scripts/bump_version.py ${{ steps.version.outputs.version }}

      - name: Generate changelog
        if: steps.check.outputs.skip_bump != 'true' && steps.version.outputs.version != ''
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit, tag and push
        if: steps.check.outputs.skip_bump != 'true' && steps.version.outputs.version != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output version for publish
        if: steps.check.outputs.version != '' || steps.version.outputs.version != ''
        id: release
        run: |
          if [ -n "${{ steps.check.outputs.version }}" ]; then
            echo "version=${{ steps.check.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  publish-pypi:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -m "not e2e"
      - run: uv run python scripts/check_sdk_sync.py
      - name: Check if version already exists on PyPI
        id: pypi_check
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          if curl -s "https://pypi.org/pypi/openubl/${VERSION}/json" | grep -q '"version"'; then
            echo "openubl ${VERSION} already on PyPI"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - run: uv build
        if: steps.pypi_check.outputs.publish == 'true'
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi_check.outputs.publish == 'true'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: cd sdk/typescript && npm ci && npm run generate && npm run build && npm test
      - name: Publish to npm (idempotent)
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          if npm view "@openubl/sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "@openubl/sdk@${VERSION} already published, skipping"
          else
            cd sdk/typescript && npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-notes:
    needs: [publish-pypi, publish-npm]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.version }}
      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          {
            echo "📦 **PyPI**: [openubl ${VERSION}](https://pypi.org/project/openubl/${VERSION}/)"
            echo ""
            echo '```bash'
            echo "pip install openubl==${VERSION}"
            echo '```'
            echo ""
            echo "📦 **npm**: [@openubl/sdk ${VERSION}](https://www.npmjs.com/package/@openubl/sdk/v/${VERSION})"
            echo ""
            echo '```bash'
            echo "npm install @openubl/sdk@${VERSION}"
            echo '```'
            echo ""
            echo "---"
            echo ""
            cat CHANGES.md
          } > RELEASE_BODY.md
          gh release create "v${VERSION}" \
            --title "Release v${VERSION}" \
            --notes-file RELEASE_BODY.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
