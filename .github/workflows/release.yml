name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find merged PR with release label
        id: check
        run: |
          PR_JSON=$(gh pr list --state merged --limit 1 --json number,labels,mergeCommit --jq '.[0]')
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MERGE_OID=$(echo "$PR_JSON" | jq -r '.mergeCommit.oid')
          if [ -z "$MERGE_OID" ] || [ "$MERGE_OID" = "null" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$MERGE_OID" HEAD; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS=$(echo "$PR_JSON" | jq -r '.labels[].name')
          if echo "$LABELS" | grep -q "^release:major$"; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "^release:minor$"; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "^release:patch$"; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate new version
        if: steps.check.outputs.found == 'true'
        id: version
        run: |
          CURRENT=$(grep '^version\s*=\s*' pyproject.toml | head -1 | sed 's/.*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          TYPE="${{ steps.check.outputs.type }}"
          if [ "$TYPE" = "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
          elif [ "$TYPE" = "minor" ]; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
          else
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - uses: astral-sh/setup-uv@v3
        if: steps.version.outputs.version != ''
      - uses: actions/setup-node@v4
        if: steps.version.outputs.version != ''
        with:
          node-version: 22

      - name: Install npm dependencies
        if: steps.version.outputs.version != ''
        run: cd sdk/typescript && npm ci

      - name: Bump version
        if: steps.version.outputs.version != ''
        run: uv run python scripts/bump_version.py ${{ steps.version.outputs.version }}

      - name: Generate changelog
        if: steps.version.outputs.version != ''
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.version.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit, tag and push
        if: steps.version.outputs.version != ''
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin main
          git push origin "v${VERSION}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
