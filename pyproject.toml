[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openubl"
version = "1.0.0"
description = "openUBL - Peruvian SUNAT Electronic Documents Library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "signxml>=4.4.0",
    "uvicorn>=0.49.0",
    "zeep>=4.3.2",
]

[project.scripts]
export-openapi = "scripts.export_openapi:main"
check-sdk-sync = "scripts.check_sdk_sync:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openubl", "scripts"]
